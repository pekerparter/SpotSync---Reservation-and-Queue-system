{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Business Info{% endblock %}

{% block content %}
<div class="bg-blue-100 min-h-screen">
    <main class="container mx-auto mt-8 p-4">
        <h1 class="text-2xl font-bold mb-4">Edit Business Info</h1>

        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <form method="post" enctype="multipart/form-data" class="p-8">
                {% csrf_token %}
                <div class="md:flex md:space-x-8">
                    <div class="md:w-1/2">
                        <div class="mb-4">
                            <img id="preview-image" class="h-48 w-full object-cover md:w-48 mb-2" {% if business.image %}src="{{ business.image.url }}"{% endif %} alt="{{ business.name }}">
                            <input type="file" name="image" id="image-upload" class="hidden" accept="image/*">
                            <label for="image-upload" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded cursor-pointer block text-center">
                                Change Image
                            </label>
                        </div>
                        <div class="mb-4">
                            <label for="business-name" class="block text-gray-700 font-bold mb-2">Business Name</label>
                            <input type="text" id="business-name" name="name" value="{{ business.name }}" class="w-full px-3 py-2 border rounded-lg" required>
                        </div>
                        <div class="mb-4">
                            <label for="address" class="block text-gray-700 font-bold mb-2">Address</label>
                            <input type="text" id="address" name="address" value="{{ business.address }}" class="w-full px-3 py-2 border rounded-lg" required>
                        </div>
                        <div class="mb-4">
                            <label for="phone-number" class="block text-gray-700 font-bold mb-2">Phone Number</label>
                            <input type="tel" id="phone-number" name="phone_number" value="{{ business.phone_number }}" class="w-full px-3 py-2 border rounded-lg" required>
                        </div>
                    </div>
                    <div class="md:w-1/2">
                        <p class="text-sm text-gray-600 mb-2">Click on the map to update the business location</p>
                        <div id="map" style="height: 300px; width: 100%; margin-bottom: 20px;"></div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label for="latitude" class="block text-sm font-medium text-gray-700">Latitude</label>
                                <input type="text" id="latitude" name="latitude" value="{{ business.latitude|default_if_none:'' }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" readonly>
                            </div>
                            <div>
                                <label for="longitude" class="block text-sm font-medium text-gray-700">Longitude</label>
                                <input type="text" id="longitude" name="longitude" value="{{ business.longitude|default_if_none:'' }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" readonly>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="mt-6 flex justify-end space-x-4">
                    <button type="submit" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">
                        Save Changes
                    </button>
                    <a href="{% url 'business_portal' %}" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                        Discard Changes
                    </a>
                </div>
            </form>
        </div>
    </main>
</div>

<script>
    document.getElementById('image-upload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview-image').src = e.target.result;
            }
            reader.readAsDataURL(file);
        }
    });
    var map, marker;

    function initMap() {
        var lat = {{ business.latitude|default_if_none:'null' }};
        var lng = {{ business.longitude|default_if_none:'null' }};
        var center = lat && lng ? {lat: lat, lng: lng} : {lat: 41.0082, lng: 28.9784}; // Default to Istanbul if no location
    
        map = new google.maps.Map(document.getElementById('map'), {
            zoom: 15,
            center: center
        });
    
        marker = new google.maps.Marker({
            position: center,
            map: map,
            draggable: true
        });
    
        // Update location when marker is dragged
        google.maps.event.addListener(marker, 'dragend', function() {
            updateLatLng(marker.getPosition());
        });
    
        // Update location when map is clicked
        google.maps.event.addListener(map, 'click', function(event) {
            marker.setPosition(event.latLng);
            updateLatLng(event.latLng);
        });
    
        // Display initial location
        displayLocation(center.lat, center.lng);
    
        var input = document.getElementById('address');
        var autocomplete = new google.maps.places.Autocomplete(input);
        autocomplete.bindTo('bounds', map);
    
        autocomplete.addListener('place_changed', function() {
            var place = autocomplete.getPlace();
            if (!place.geometry) {
                return;
            }
    
            if (place.geometry.viewport) {
                map.fitBounds(place.geometry.viewport);
            } else {
                map.setCenter(place.geometry.location);
                map.setZoom(17);
            }
    
            marker.setPosition(place.geometry.location);
            updateLatLng(place.geometry.location);
        });
    }
    
    function updateLatLng(location) {
        var lat = location.lat();
        var lng = location.lng();
        document.getElementById('latitude').value = lat.toFixed(6);
        document.getElementById('longitude').value = lng.toFixed(6);
        displayLocation(lat, lng);
    }
    
    function displayLocation(lat, lng) {
        var locationDisplay = document.getElementById('current-location');
        if (locationDisplay) {
            locationDisplay.textContent = `Lat: ${lat.toFixed(6)}, Lng: ${lng.toFixed(6)}`;
            locationDisplay.classList.add('text-green-600');
            setTimeout(() => {
                locationDisplay.classList.remove('text-green-600');
            }, 3000);
        }
    }
    initMap();
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB-U-_hABXjiT6-tNfxRUoJCMtX5JK19nk&libraries=places&callback=initMap" async defer></script>
{% endblock %}
