<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SpotSync{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sort-indicator {
            display: inline-block;
            width: 0;
            height: 0;
            margin-left: 5px;
            vertical-align: middle;
        }
    
        th:hover .sort-indicator:empty::before {
            content: '▲▼';
            opacity: 0.3;
        }
    </style>
</head>
<body class="bg-gray-100">
    <nav class="bg-blue-500 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{% url 'landing_page' %}" class="text-2xl font-bold flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 10l9-7 9 7-9 7-9-7z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 21V9l-6 4.5m15 0L15 9v12m-6 0l6-4.5" />
                </svg>
                SpotSync
            </a>
            <div class="flex gap-6">
                {% if user.staff_role != 'CUSTOMER' and user.business %}
                    <a href="{% url 'business_portal' %}" class="hover:underline">Business Portal</a>
                {% endif %}
                <a href="{% url 'categories' %}" class="hover:underline">Categories</a>
                <a href="{% url 'my_reservations' %}" class="hover:underline">My Reservations</a>
                <a href="{% url 'profile' %}" class="hover:underline">Profile</a>
                <form method="post" action="{% url 'custom_logout' %}" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="bg-red-500 px-3 py-2 rounded hover:bg-red-600 transition-colors duration-200">
                        Sign Out
                    </button>
                </form>
            </div>
        </div>
    </nav>


    <main class="container mx-auto mt-8 p-4">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
