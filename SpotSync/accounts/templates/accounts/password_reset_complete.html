<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h2 class="text-2xl font-bold text-center mb-6">Password Reset Complete</h2>
            <p class="text-gray-700">
                Your password has been set. You may go ahead and log in now.
            </p>
            <a href="{% url 'custom_login' %}" class="block w-full text-center bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 mt-4">
                Log in
            </a>
        </div>
    </div>
</body>

</html>
