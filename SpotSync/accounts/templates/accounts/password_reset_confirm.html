<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h2 class="text-2xl font-bold text-center mb-6">Reset Your Password</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="{{ form.new_password1.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">New Password</label>
                    {{ form.new_password1 }}
                </div>
                <div class="mb-4">
                    <label for="{{ form.new_password2.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-2">Confirm New Password</label>
                    {{ form.new_password2 }}
                </div>
                <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 mt-4">
                    CHANGE PASSWORD
                </button>
            </form>
        </div>
    </div>
</body>

</html>
